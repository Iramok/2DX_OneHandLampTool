<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>片手難易度Viewer [Sparkle Shower]</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e2e38;

      --lamp-easy: #43B54B;
      --lamp-hard: #E53935;
      --lamp-exhard: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    /* ヘッダー＆ユーザーエリア */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0;
    }

    .auth-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .user-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-amber);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .meta-info {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* フィルターエリア（アコーディオン化） */
    .filter-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .filter-panel summary {
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-main);
      background-color: #16161a;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }

    .filter-panel summary::-webkit-details-marker {
      display: none;
    }

    .filter-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border-color);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
      text-decoration: underline;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn {
      background-color: #2a2a35;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:hover {
      background-color: #363645;
    }

    .btn-google {
      background-color: #4285f4;
      color: #fff;
      border: none;
    }

    .btn-google:hover {
      background-color: #357ae8;
    }

    .btn-mode.active, .btn-lamp-filter.active, .history-tab-btn.active {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .btn-bemani.active {
      background-color: var(--accent-purple);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .btn-rank {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-rank.active {
      background-color: var(--accent-amber);
      border-color: var(--accent-amber);
      color: #000;
    }

    /* おみくじ・履歴ボタン */
    .btn-omikuji {
      background-color: #ec4899;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 0.9rem;
    }

    .btn-omikuji:hover {
      background-color: #db2777;
    }

    .btn-last-omikuji {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 0.9rem;
    }

    .btn-last-omikuji:hover {
      background-color: #2563eb;
    }

    .btn-history {
      background-color: #8b5cf6;
      color: #fff;
      border: none;
      width: 100%;
      padding: 8px;
      font-size: 0.9rem;
    }

    .btn-history:hover {
      background-color: #7c3aed;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #16161a;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    /* モバイル最適化（iPhone用 2行分割表示） */
    @media (max-width: 640px) {
      body {
        padding: 8px;
      }

      thead {
        display: none;
      }

      tr {
        display: flex;
        flex-wrap: wrap;
        padding: 10px 8px;
        align-items: center;
        gap: 6px;
        border-bottom: 1px solid var(--border-color);
      }

      td {
        padding: 0;
        border: none;
      }

      .col-rank {
        order: 1;
        width: auto;
        font-size: 0.85rem;
      }

      .col-bemani {
        order: 2;
        width: auto;
      }

      .col-title {
        order: 3;
        width: 100%;
        flex-basis: calc(100% - 110px);
        min-width: 0;
      }

      .col-title strong {
        font-size: 0.9rem;
      }

      .col-lamp-L {
        order: 4;
        display: inline-flex;
        width: auto;
        margin-top: 4px;
      }

      .col-lamp-R {
        order: 5;
        display: inline-flex;
        width: auto;
        margin-top: 4px;
        margin-left: 8px;
      }

      .col-lamp-container {
        gap: 4px;
      }

      .lamp-label {
        font-size: 0.75rem;
      }

      .lamp-group {
        padding: 2px;
        gap: 2px;
      }

      .lamp-btn {
        padding: 4px 6px;
        font-size: 0.75rem;
        min-width: 26px;
      }
    }
  </style>

  <!-- Firebase モジュール読み込み & 設定 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLvLVqpBAh9jbHsTbZc8mYy3OEjGpfXfI",
      authDomain: "dxonehandlamptool.firebaseapp.com",
      projectId: "dxonehandlamptool",
      storageBucket: "dxonehandlamptool.firebasestorage.app",
      messagingSenderId: "518633479589",
      appId: "1:518633479589:web:070ddaf3929639eb0f5c4c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let unsubscribeFirestore = null;

    const loginArea = document.getElementById('loginArea');
    const userArea = document.getElementById('userArea');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userIcon = document.getElementById('userIcon');
    const userName = document.getElementById('userName');
    const syncStatus = document.getElementById('syncStatus');

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("ログインエラー:", err);
        alert("Googleログインに失敗しました。");
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        if (unsubscribeFirestore) unsubscribeFirestore();
        await signOut(auth);
      } catch (err) {
        console.error("ログアウトエラー:", err);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName || 'ユーザー';
        userIcon.src = user.photoURL || '';
        
        loginArea.style.display = 'none';
        userArea.style.display = 'flex';

        listenToCloudData(user.uid);
      } else {
        currentUser = null;
        if (unsubscribeFirestore) unsubscribeFirestore();
        loginArea.style.display = 'block';
        userArea.style.display = 'none';
        syncStatus.textContent = '(未ログイン)';

        // 未ログイン時は初期化
        userClearData = {};
        lastOmikujiSongs = [];
        clearHistory = [];
        document.getElementById('showLastOmikujiBtn').style.display = 'none';
        resetFilterStateToDefault();
        renderTable();
      }
    });

    function listenToCloudData(uid) {
      syncStatus.textContent = '同期中...';
      const docRef = doc(db, "cleardata", uid);

      unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const cloudData = docSnap.data();
          userClearData = cloudData.data || {};
          clearHistory = cloudData.history || [];
          
          if (cloudData.filterState) {
            applyFilterState(cloudData.filterState);
          }

          if (cloudData.omikujiSongs && cloudData.omikujiSongs.length > 0) {
            lastOmikujiSongs = cloudData.omikujiSongs;
            document.getElementById('showLastOmikujiBtn').style.display = 'block';
          } else {
            lastOmikujiSongs = [];
            document.getElementById('showLastOmikujiBtn').style.display = 'none';
          }

          syncStatus.textContent = '同期完了';
        } else {
          saveUserDataToCloud();
        }
        renderTable();
      }, (err) => {
        console.error("同期エラー:", err);
        syncStatus.textContent = '同期エラー';
      });
    }

    window.saveUserDataToCloud = async function() {
      if (!currentUser) return;
      syncStatus.textContent = '保存中...';
      try {
        const docRef = doc(db, "cleardata", currentUser.uid);
        await setDoc(docRef, {
          data: userClearData,
          history: clearHistory,
          filterState: window.getCurrentFilterState(),
          omikujiSongs: lastOmikujiSongs,
          updatedAt: new Date().toISOString()
        }, { merge: true });
        syncStatus.textContent = '同期完了';
      } catch (err) {
        console.error("保存エラー:", err);
        syncStatus.textContent = '保存失敗';
      }
    };

    window.toggleLamp = function(title, hand, lampType) {
      if (!currentUser) {
        alert("ランプ情報を保存・変更するにはGoogleログインが必要です。");
        return;
      }

      if (!userClearData[title]) {
        userClearData[title] = { L: { E: false, H: false, EX: false }, R: { E: false, H: false, EX: false } };
      }
      
      const currentState = userClearData[title][hand][lampType];
      const newState = !currentState;
      userClearData[title][hand][lampType] = newState;

      // ランプが OFF -> ON になったときのみ履歴に追加
      if (newState) {
        const song = songData.find(s => s.title === title);
        if (song) {
          const acRank = song.acDifficulty || '-';
          const bemaniDiff = song.bemaniDifficulty || '-';
          
          const nowStr = new Date().toLocaleString('ja-JP', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
          });

          clearHistory.unshift({
            timestamp: nowStr,
            title: title,
            bemaniDifficulty: bemaniDiff,
            acDifficulty: acRank,
            hand: hand,
            lampType: lampType
          });
        }
      }

      const baseBtnId = `lamp-${hand}-${lampType}-${slugify(title)}`;
      document.querySelectorAll(`[id="${baseBtnId}"]`).forEach(btnEl => {
        btnEl.classList.toggle('active', newState);
      });

      window.saveUserDataToCloud();
    };
  </script>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>片手難易度表 Sparkle Shower</h1>

      <div class="auth-container">
        <div id="loginArea">
          <button id="loginBtn" class="btn btn-google">Googleログイン</button>
        </div>
        <div id="userArea" class="user-profile" style="display: none;">
          <img id="userIcon" class="user-avatar" src="" alt="Avatar">
          <span id="userName" class="user-name"></span>
          <button id="logoutBtn" class="btn">ログアウト</button>
        </div>
        <span id="syncStatus" class="sync-status"></span>
      </div>
    </div>

    <div id="meta" class="meta-info">データを読み込み中...</div>

    <!-- フィルターエリア（アコーディオン化） -->
    <details class="filter-panel" open>
      <summary>
        <span>🔍 フィルター・おみくじ設定</span>
        <span class="arrow-icon" style="font-size: 0.8rem; color: var(--text-sub);">▼</span>
      </summary>
      <div class="filter-content">
        <div class="filter-group">
          <div class="filter-label">MODE</div>
          <div class="btn-group">
            <button class="btn btn-mode active" data-mode="AC">AC</button>
            <button class="btn btn-mode" data-mode="INF">INF</button>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-label">
            <span>公式難易度 (複数選択可)</span>
            <button id="clearBemani" class="clear-btn">全解除</button>
          </div>
          <div class="btn-group">
            <button class="btn btn-bemani" data-bemani="☆11">☆11</button>
            <button class="btn btn-bemani" data-bemani="☆12">☆12</button>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-label">
            <span>片手難易度 (複数選択可)</span>
            <button id="clearRank" class="clear-btn">全解除</button>
          </div>
          <div class="btn-group" id="rankBtnContainer"></div>
        </div>

        <div class="filter-group">
          <div class="filter-label">
            <span>ランプ状態フィルター</span>
            <button id="clearLampFilter" class="clear-btn">解除</button>
          </div>
          <div class="btn-group">
            <button class="btn btn-lamp-filter" data-lampfilter="EXISTS">ランプあり</button>
            <button class="btn btn-lamp-filter" data-lampfilter="NONE">ランプなし</button>
            <button class="btn btn-lamp-filter" data-lampfilter="E">Eのみ</button>
            <button class="btn btn-lamp-filter" data-lampfilter="H">Hのみ</button>
            <button class="btn btn-lamp-filter" data-lampfilter="EX">EXのみ</button>
          </div>
        </div>

        <div class="filter-group">
          <input type="text" id="searchInput" class="search-input" placeholder="曲名で検索...">
        </div>

        <div class="filter-group">
          <div class="btn-group" style="display: flex; gap: 8px;">
            <button id="omikujiBtn" class="btn btn-omikuji" style="flex: 1; margin-top: 0;">🎲 10曲おみくじ(フィルター内ランセレ)</button>
            <button id="showLastOmikujiBtn" class="btn btn-last-omikuji" style="flex: 1; margin-top: 0; display: none;">🎲 おみくじ(前回の結果)</button>
          </div>
          <button id="showHistoryBtn" class="btn btn-history">📜 クリア更新履歴を見る</button>
        </div>
      </div>
    </details>

    <div id="accordionContainer">
      <div style="text-align: center; color: var(--text-sub); padding: 20px;">データを読み込み中...</div>
    </div>
  </div>

  <!-- おみくじ結果表示用モーダル -->
  <div id="omikujiModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); justify-content: center; align-items: center; z-index: 1000; padding: 16px;">
    <div class="modal-content" style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 600px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <div class="modal-header" style="padding: 14px 16px; background-color: #16161a; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; font-size: 1.1rem; color: var(--accent-amber);">🎲 おみくじ結果 (10曲)</h2>
        <button class="modal-close" id="closeModalBtn" style="background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <div class="modal-body" id="omikujiModalBody" style="padding: 12px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- 履歴表示用モーダル -->
  <div id="historyModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); justify-content: center; align-items: center; z-index: 1000; padding: 16px;">
    <div class="modal-content" style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 650px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <div class="modal-header" style="padding: 14px 16px; background-color: #16161a; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; font-size: 1.1rem; color: #8b5cf6;">📜 クリア更新履歴</h2>
        <button class="modal-close" id="closeHistoryModalBtn" style="background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <!-- 履歴の左右切り替え用タブ（左手履歴を左、右手履歴を右に配置） -->
      <div style="padding: 10px 16px 0 16px; background-color: #16161a; display: flex; gap: 8px;">
        <button id="historyTabL" class="btn history-tab-btn" data-hand="L" style="flex: 1; padding: 6px; font-size: 0.85rem;">左手履歴</button>
        <button id="historyTabR" class="btn history-tab-btn active" data-hand="R" style="flex: 1; padding: 6px; font-size: 0.85rem;">右手履歴</button>
      </div>
      <div class="modal-body" id="historyModalBody" style="padding: 12px; overflow-y: auto;"></div>
    </div>
  </div>

  <script>
    const RANKS = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
    
    let songData = [];
    let userClearData = {};
    let clearHistory = [];
    let currentFilteredSongs = [];
    let lastOmikujiSongs = [];
    let currentHistoryHand = 'R'; // デフォルトは右手

    let state = {
      mode: 'AC',
      selectedBemanis: [],
      selectedRanks: [],
      selectedLampFilter: null,
      searchQuery: ''
    };

    window.getCurrentFilterState = function() {
      return state;
    };

    window.resetFilterStateToDefault = function() {
      state = {
        mode: 'AC',
        selectedBemanis: [],
        selectedRanks: [],
        selectedLampFilter: null,
        searchQuery: ''
      };
      updateFilterUI();
    };

    window.applyFilterState = function(parsed) {
      state.mode = parsed.mode || 'AC';
      state.selectedBemanis = parsed.selectedBemanis || [];
      state.selectedRanks = parsed.selectedRanks || [];
      state.selectedLampFilter = parsed.selectedLampFilter || null;
      state.searchQuery = parsed.searchQuery || '';
      updateFilterUI();
    };

    function updateFilterUI() {
      document.querySelectorAll('.btn-mode').forEach(btn => {
        if (btn.dataset.mode === state.mode) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      document.querySelectorAll('.btn-bemani').forEach(btn => {
        if (state.selectedBemanis.includes(btn.dataset.bemani)) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      document.querySelectorAll('.btn-rank').forEach(btn => {
        if (state.selectedRanks.includes(btn.dataset.rank)) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      document.querySelectorAll('.btn-lamp-filter').forEach(btn => {
        if (btn.dataset.lampfilter === state.selectedLampFilter) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = state.searchQuery;
    }

    document.addEventListener('DOMContentLoaded', () => {
      buildRankButtons();
      setupEventListeners();
      fetchData();
    });

    function buildRankButtons() {
      const container = document.getElementById('rankBtnContainer');
      container.innerHTML = RANKS.map(rank => 
        `<button class="btn btn-rank" data-rank="${rank}">${rank}</button>`
      ).join('');
    }

    async function fetchData() {
      try {
        const res = await fetch('difficulty-data_normalized.json');
        if (!res.ok) throw new Error('JSONの読み込みに失敗しました');
        const data = await res.json();
        songData = data.songs;
        renderMeta(data.meta);
        renderTable();
      } catch (err) {
        document.getElementById('meta').innerText = 'データ読み込みエラー';
        document.getElementById('accordionContainer').innerHTML = 
          `<div style="color:#f87171; text-align:center; padding:20px;">エラー: ${err.message}</div>`;
      }
    }

    function renderMeta(meta) {
      document.getElementById('meta').innerText = 
        `全 ${meta.record_count} 件 (AC: ${meta.ac_count}件 / INF: ${meta.inf_count}件) | 更新日: ${meta.generated}`;
    }

    function setupEventListeners() {
      // MODEボタン
      document.querySelectorAll('.btn-mode').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.mode = e.target.dataset.mode;
          if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
          renderTable();
        });
      });

      // 公式難易度ボタン
      document.querySelectorAll('.btn-bemani').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const val = e.target.dataset.bemani;
          toggleSelection(val, state.selectedBemanis);
          e.target.classList.toggle('active');
          if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
          renderTable();
        });
      });

      // 片手難易度ボタン
      document.getElementById('rankBtnContainer').addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-rank')) {
          const val = e.target.dataset.rank;
          toggleSelection(val, state.selectedRanks);
          e.target.classList.toggle('active');
          if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
          renderTable();
        }
      });

      // ランプ状態フィルターボタン
      document.querySelectorAll('.btn-lamp-filter').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const val = e.target.dataset.lampfilter;
          if (state.selectedLampFilter === val) {
            state.selectedLampFilter = null;
            e.target.classList.remove('active');
          } else {
            document.querySelectorAll('.btn-lamp-filter').forEach(b => b.classList.remove('active'));
            state.selectedLampFilter = val;
            e.target.classList.add('active');
          }
          if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
          renderTable();
        });
      });

      document.getElementById('clearLampFilter').addEventListener('click', () => {
        state.selectedLampFilter = null;
        document.querySelectorAll('.btn-lamp-filter').forEach(b => b.classList.remove('active'));
        if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
        renderTable();
      });

      document.getElementById('clearBemani').addEventListener('click', () => {
        state.selectedBemanis = [];
        document.querySelectorAll('.btn-bemani').forEach(b => b.classList.remove('active'));
        if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
        renderTable();
      });

      document.getElementById('clearRank').addEventListener('click', () => {
        state.selectedRanks = [];
        document.querySelectorAll('.btn-rank').forEach(b => b.classList.remove('active'));
        if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
        renderTable();
      });

      // 検索窓
      document.getElementById('searchInput').addEventListener('input', (e) => {
        state.searchQuery = e.target.value.toLowerCase().trim();
        if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
        renderTable();
      });

      // 新規おみくじを引く
      document.getElementById('omikujiBtn').addEventListener('click', () => {
        if (currentFilteredSongs.length === 0) {
          alert("おみくじを引く対象の楽曲がありません。フィルター条件を変更してください。");
          return;
        }

        const shuffled = [...currentFilteredSongs].sort(() => 0.5 - Math.random());
        lastOmikujiSongs = shuffled.slice(0, 10);

        if (typeof window.saveUserDataToCloud === 'function') window.saveUserDataToCloud();
        document.getElementById('showLastOmikujiBtn').style.display = 'block';

        openOmikujiModal(lastOmikujiSongs, "🎲 本日のおみくじ (10曲)");
      });

      // 前回の結果を見る
      document.getElementById('showLastOmikujiBtn').addEventListener('click', () => {
        if (lastOmikujiSongs.length === 0) {
          alert("保存されたおみくじの結果がありません。");
          return;
        }
        openOmikujiModal(lastOmikujiSongs, "🎲 保存されたおみくじ結果 (10曲)");
      });

      document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.getElementById('omikujiModal').style.display = 'none';
      });

      // 履歴を見るボタン
      document.getElementById('showHistoryBtn').addEventListener('click', () => {
        currentHistoryHand = 'R'; // 開くときはデフォルトで右手
        updateHistoryTabsUI();
        openHistoryModal();
      });

      document.getElementById('closeHistoryModalBtn').addEventListener('click', () => {
        document.getElementById('historyModal').style.display = 'none';
      });

      // 履歴モーダルの左右タブ切り替え
      document.getElementById('historyTabR').addEventListener('click', () => {
        currentHistoryHand = 'R';
        updateHistoryTabsUI();
        openHistoryModal();
      });

      document.getElementById('historyTabL').addEventListener('click', () => {
        currentHistoryHand = 'L';
        updateHistoryTabsUI();
        openHistoryModal();
      });
    }

    function updateHistoryTabsUI() {
      document.getElementById('historyTabR').classList.toggle('active', currentHistoryHand === 'R');
      document.getElementById('historyTabL').classList.toggle('active', currentHistoryHand === 'L');
    }

    function toggleSelection(item, array) {
      const idx = array.indexOf(item);
      if (idx > -1) array.splice(idx, 1);
      else array.push(item);
    }

    function checkLampStatus(title, filterType) {
      const info = userClearData[title];
      
      const hasL_E = info && info.L && info.L.E;
      const hasL_H = info && info.L && info.L.H;
      const hasL_EX = info && info.L && info.L.EX;

      const hasR_E = info && info.R && info.R.E;
      const hasR_H = info && info.R && info.R.H;
      const hasR_EX = info && info.R && info.R.EX;

      const anyLampActive = hasL_E || hasL_H || hasL_EX || hasR_E || hasR_H || hasR_EX;

      switch(filterType) {
        case 'EXISTS':
          return anyLampActive;
        case 'NONE':
          return !anyLampActive;
        case 'E':
          return hasL_E || hasR_E;
        case 'H':
          return hasL_H || hasR_H;
        case 'EX':
          return hasL_EX || hasR_EX;
        default:
          return true;
      }
    }

    function renderTable() {
      const container = document.getElementById('accordionContainer');

      currentFilteredSongs = songData.filter(song => {
        const isAcMode = state.mode === 'AC';
        const isPresent = isAcMode ? song.ac : song.inf;
        const targetRank = isAcMode ? song.acDifficulty : song.infDifficulty;

        if (!isPresent || !targetRank) return false;

        if (state.selectedBemanis.length > 0 && !state.selectedBemanis.includes(song.bemaniDifficulty)) {
          return false;
        }

        if (state.selectedRanks.length > 0 && !state.selectedRanks.includes(targetRank)) {
          return false;
        }

        if (state.selectedLampFilter && !checkLampStatus(song.title, state.selectedLampFilter)) {
          return false;
        }

        if (state.searchQuery && !song.title.toLowerCase().includes(state.searchQuery)) {
          return false;
        }

        return true;
      });

      if (currentFilteredSongs.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:40px; background:var(--card-bg); border-radius:8px;">該当する楽曲がありません</div>';
        return;
      }

      const grouped = {};
      RANKS.forEach(rank => { grouped[rank] = []; });

      currentFilteredSongs.forEach(song => {
        const rankVal = state.mode === 'AC' ? song.acDifficulty : song.infDifficulty;
        if (grouped[rankVal]) {
          grouped[rankVal].push(song);
        }
      });

      RANKS.forEach(rank => {
        grouped[rank].sort((a, b) => {
          if (a.bemaniDifficulty !== b.bemaniDifficulty) {
            return a.bemaniDifficulty.localeCompare(b.bemaniDifficulty);
          }
          return a.title.localeCompare(b.title, 'ja');
        });
      });

      let html = '';
      RANKS.forEach(rank => {
        const songsInRank = grouped[rank];
        if (songsInRank.length === 0) return;

        const rows = songsInRank.map(song => buildSongRowHtml(song)).join('');

        html += `
          <details class="accordion-group" open style="margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background-color: var(--card-bg);">
            <summary style="padding: 12px 14px; font-size: 1rem; font-weight: bold; color: var(--accent-amber); background-color: #16161a; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; outline: none;">
              <div class="summary-title" style="display: flex; align-items: center; gap: 8px;">
                <span>難易度 ${rank}</span>
                <span class="summary-count" style="font-size: 0.8rem; color: var(--text-sub); font-weight: normal;">(${songsInRank.length}件)</span>
              </div>
              <span class="arrow-icon" style="font-size: 0.8rem; color: var(--text-sub);">▼</span>
            </summary>
            <table style="width: 100%; border-collapse: collapse; border-top: 1px solid var(--border-color);">
              <thead>
                <tr>
                  <th style="padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); background-color: #1a1a22; color: var(--text-sub); font-size: 0.8rem; width: 80px;">片手難易度</th>
                  <th style="padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); background-color: #1a1a22; color: var(--text-sub); font-size: 0.8rem; width: 70px;">公式難易度</th>
                  <th style="padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); background-color: #1a1a22; color: var(--text-sub); font-size: 0.8rem; width: auto;">曲名</th>
                  <th style="padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border-color); background-color: #1a1a22; color: var(--text-sub); font-size: 0.8rem; width: 140px;">左片手</th>
                  <th style="padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border-color); background-color: #1a1a22; color: var(--text-sub); font-size: 0.8rem; width: 140px;">右片手</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </details>
        `;
      });

      container.innerHTML = html;
    }

    function buildSongRowHtml(song) {
      const rank = state.mode === 'AC' ? song.acDifficulty : song.infDifficulty;
      const diffBadge = song.bemaniDifficulty === '☆12' ? 'badge-12' : 'badge-11';
      const titleKey = song.title;
      const clearInfo = userClearData[titleKey] || { L: { E: false, H: false, EX: false }, R: { E: false, H: false, EX: false } };

      return `
        <tr style="border-bottom: 1px solid var(--border-color);">
          <td class="col-rank" style="padding: 10px 12px; font-weight: bold; font-size: 0.95rem; color: var(--accent-amber);">${escapeHtml(rank)}</td>
          <td class="col-bemani" style="padding: 10px 12px;"><span class="badge ${diffBadge}" style="display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; ${song.bemaniDifficulty === '☆12' ? 'background-color: #4a1d24; color: #f87171;' : 'background-color: #1e3a5f; color: #60a5fa;'}">${song.bemaniDifficulty}</span></td>
          <td class="col-title" style="padding: 10px 12px;"><strong style="font-size: 0.95rem; word-break: break-all;">${escapeHtml(song.title)}</strong></td>
          <td class="col-lamp col-lamp-L" style="padding: 10px 12px; text-align: center;">
            <div class="col-lamp-container" style="display: inline-flex; align-items: center; gap: 6px;">
              <span class="lamp-label" style="font-size: 0.8rem; color: var(--text-sub);">左</span>
              <div class="lamp-group" style="display: inline-flex; gap: 2px; background-color: #16161a; padding: 3px; border-radius: 6px; border: 1px solid var(--border-color);">
                <button id="lamp-L-E-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L && clearInfo.L.E ? 'active' : ''}" data-lamp="E" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'E')" style="border: none; background-color: ${clearInfo.L && clearInfo.L.E ? 'var(--lamp-easy)' : '#2a2a35'}; color: ${clearInfo.L && clearInfo.L.E ? '#fff' : 'var(--text-sub)'}; font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; min-width: 32px; text-align: center;">E</button>
                <button id="lamp-L-H-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L && clearInfo.L.H ? 'active' : ''}" data-lamp="H" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'H')" style="border: none; background-color: ${clearInfo.L && clearInfo.L.H ? 'var(--lamp-hard)' : '#2a2a35'}; color: ${clearInfo.L && clearInfo.L.H ? '#fff' : 'var(--text-sub)'}; font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; min-width: 32px; text-align: center;">H</button>
                <button id="lamp-L-EX-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L && clearInfo.L.EX ? 'active' : ''}" data-lamp="EX" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'EX')" style="border: none; background-color: ${clearInfo.L && clearInfo.L.EX ? 'var(--lamp-exhard)' : '#2a2a35'}; color: ${clearInfo.L && clearInfo.L.EX ? '#000' : 'var(--text-sub)'}; font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; min-width: 32px; text-align: center;">EX</button>
              </div>
            </div>
          </td>
          <td class="col-lamp col-lamp-R" style="padding: 10px 12px; text-align: center;">
            <div class="col-lamp-container" style="display: inline-flex; align-items: center; gap: 6px;">
              <span class="lamp-label" style="font-size: 0.8rem; color: var(--text-sub);">右</span>
              <div class="lamp-group" style="display: inline-flex; gap: 2px; background-color: #16161a; padding: 3px; border-radius: 6px; border: 1px solid var(--border-color);">
                <button id="lamp-R-E-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R && clearInfo.R.E ? 'active' : ''}" data-lamp="E" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'E')" style="border: none; background-color: ${clearInfo.R && clearInfo.R.E ? 'var(--lamp-easy)' : '#2a2a35'}; color: ${clearInfo.R && clearInfo.R.E ? '#fff' : 'var(--text-sub)'}; font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; min-width: 32px; text-align: center;">E</button>
                <button id="lamp-R-H-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R && clearInfo.R.H ? 'active' : ''}" data-lamp="H" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'H')" style="border: none; background-color: ${clearInfo.R && clearInfo.R.H ? 'var(--lamp-hard)' : '#2a2a35'}; color: ${clearInfo.R && clearInfo.R.H ? '#fff' : 'var(--text-sub)'}; font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; min-width: 32px; text-align: center;">H</button>
                <button id="lamp-R-EX-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R && clearInfo.R.EX ? 'active' : ''}" data-lamp="EX" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'EX')" style="border: none; background-color: ${clearInfo.R && clearInfo.R.EX ? 'var(--lamp-exhard)' : '#2a2a35'}; color: ${clearInfo.R && clearInfo.R.EX ? '#000' : 'var(--text-sub)'}; font-size: 0.85rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; min-width: 32px; text-align: center;">EX</button>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function openOmikujiModal(songs, titleText) {
      document.querySelector('#omikujiModal .modal-header h2').textContent = titleText;
      const modalBody = document.getElementById('omikujiModalBody');
      const rows = songs.map(song => buildSongRowHtml(song)).join('');

      modalBody.innerHTML = `
        <table style="width: 100%; border-collapse: collapse;">
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;

      document.getElementById('omikujiModal').style.display = 'flex';
    }

    function openHistoryModal() {
      const historyBody = document.getElementById('historyModalBody');
      
      const filteredHistory = clearHistory.filter(item => item.hand === currentHistoryHand);
      const handLabelName = currentHistoryHand === 'R' ? '右手' : '左手';
      
      if (!filteredHistory || filteredHistory.length === 0) {
        historyBody.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:30px;">まだ${handLabelName}のクリア更新履歴がありません。ランプを点灯させるとここに記録されます。</div>`;
      } else {
        const rows = filteredHistory.map(item => {
          const lampName = item.lampType;
          let lampBg = 'var(--lamp-easy)';
          if (lampName === 'H') lampBg = 'var(--lamp-hard)';
          if (lampName === 'EX') lampBg = 'var(--lamp-exhard)';

          return `
            <tr style="border-bottom: 1px solid var(--border-color);">
              <td style="padding: 10px 12px; font-size: 0.8rem; color: var(--text-sub); white-space: nowrap;">${escapeHtml(item.timestamp)}</td>
              <td style="padding: 10px 12px;"><span style="display:inline-block; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; background-color:#1e3a5f; color:#60a5fa;">${escapeHtml(item.bemaniDifficulty)}</span></td>
              <td style="padding: 10px 12px; font-weight: bold; color: var(--accent-amber);">${escapeHtml(item.acDifficulty)}</td>
              <td style="padding: 10px 12px;"><strong style="font-size: 0.9rem;">${escapeHtml(item.title)}</strong></td>
              <td style="padding: 10px 12px; text-align: center;"><span style="display:inline-block; padding:2px 6px; border-radius:4px; font-size:0.75rem; font-weight:bold; background-color:${lampBg}; color:${lampName === 'EX' ? '#000' : '#fff'};">${lampName}</span></td>
            </tr>
          `;
        }).join('');

        historyBody.innerHTML = `
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr>
                <th style="padding: 8px 12px; text-align: left; background-color: #16161a; color: var(--text-sub); font-size: 0.75rem;">更新日時</th>
                <th style="padding: 8px 12px; text-align: left; background-color: #16161a; color: var(--text-sub); font-size: 0.75rem;">公式</th>
                <th style="padding: 8px 12px; text-align: left; background-color: #16161a; color: var(--text-sub); font-size: 0.75rem;">AC難易度</th>
                <th style="padding: 8px 12px; text-align: left; background-color: #16161a; color: var(--text-sub); font-size: 0.75rem;">曲名</th>
                <th style="padding: 8px 12px; text-align: center; background-color: #16161a; color: var(--text-sub); font-size: 0.75rem;">ランプ</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
      }

      document.getElementById('historyModal').style.display = 'flex';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function slugify(str) {
      return encodeURIComponent(str).replace(/%/g, '_');
    }
  </script>
</body>
</html>
