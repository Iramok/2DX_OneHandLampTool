<title>片手難易度表</title>
<style>
:root{color-scheme:light dark}
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;margin:0;background:#f6f7f9;color:#222}
main{max-width:1200px;margin:0 auto;padding:24px}
h1{margin:0 0 8px}
.note{color:#666;margin-bottom:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;position:sticky;top:0;background:#f6f7f9;padding:10px 0;z-index:2}

.yes{font-weight:700}
.no{color:#888}
@media(prefers-color-scheme:dark){
body{background:#17181a;color:#eee}
.note,.stats{color:#aaa}
.controls{background:#17181a}
input,select,button,.wrap{background:#222;color:#eee;border-color:#555}

td,th{border-color:#444}
}
</style>
</head>

<main>
<h1>片手難易度表</h1>
<div class="note">AC版とINFINITAS版を別々に保持。曲名が両方に存在する場合でも、難易度はそれぞれ表示します。</div>

</select>
<select id="platform">
<option value="">収録：すべて</option>
<option value="ac">AC版あり</option>
<option value="inf">INFINITAS版あり</option>
<option value="both">AC・INFINITAS両方</option>
<option value="aconly">ACのみ</option>
<option value="infonly">INFINITASのみ</option>
</select>
<button id="save">JSONを保存</button>
</div>
<div class="stats" id="stats"></div>
<div class="wrap">
<table>
<thead><tr><th>曲名</th><th>AC版 難易度</th><th>AC版</th><th>INFINITAS 難易度</th><th>INFINITAS版</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</main>

const songs=DATA.songs;
const q=document.getElementById('q'), diff=document.getElementById('diff'), platform=document.getElementById('platform');
const tbody=document.getElementById('tbody'), stats=document.getElementById('stats');

function mark(v) {
  return v ? '<span class="yes">〇</span>' : '<span class="no">×</span>';
}
function render() {
  const needle=q.value.trim().toLowerCase();
  const d=diff.value, p=platform.value;
  const rows=songs.filter(s=>{
    if(needle && !s.title.toLowerCase().includes(needle)) return false;
    if(d && s.acDifficulty!==d && s.infDifficulty!==d) return false;
    if(p==='ac' && !s.ac) return false;
    if(p==='inf' && !s.inf) return false;
    if(p==='both' && !(s.ac&&s.inf)) return false;
    if(p==='aconly' && !(s.ac&&!s.inf)) return false;
    if(p==='infonly' && !(!s.ac&&s.inf)) return false;
    return true;
  });
  stats.textContent=`${rows.length}件 / 全${songs.length}件`;
  tbody.innerHTML=rows.map(s=>`<tr>
    <td>${escapeHtml(s.title)}</td>
    <td>${s.acDifficulty ?? '—'}</td>
    <td>${mark(s.ac)}</td>
    <td>${s.infDifficulty ?? '—'}</td>
    <td>${mark(s.inf)}</td>
  </tr>`).join('');
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
[q,diff,platform].forEach(x=>x.addEventListener('input',render));
document.getElementById('save').onclick=()=>{
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='difficulty-data.json'; a.click();
  URL.revokeObjectURL(a.href);
};
render();
</script>
