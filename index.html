<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>片手難易度表 Sparkle Shower</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e2e38;

      --lamp-easy: #43B54B;
      --lamp-hard: #E53935;
      --lamp-exhard: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    /* ヘッダー＆ユーザーエリア */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0;
    }

    .auth-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .user-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-amber);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .meta-info {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* フィルターエリア */
    .filter-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
      text-decoration: underline;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn {
      background-color: #2a2a35;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:hover {
      background-color: #363645;
    }

    .btn-google {
      background-color: #4285f4;
      color: #fff;
      border: none;
    }

    .btn-google:hover {
      background-color: #357ae8;
    }

    .btn-mode.active, .btn-lamp-filter.active {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .btn-bemani.active {
      background-color: var(--accent-purple);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .btn-rank {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-rank.active {
      background-color: var(--accent-amber);
      border-color: var(--accent-amber);
      color: #000;
    }

    /* おみくじボタン */
    .btn-omikuji {
      background-color: #ec4899;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
    }

    .btn-omikuji:hover {
      background-color: #db2777;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #16161a;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    /* モーダル（おみくじ表示用） */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 14px 16px;
      background-color: #16161a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--accent-amber);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 12px;
      overflow-y: auto;
    }

    /* アコーディオン & リストテーブル */
    .accordion-group {
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--card-bg);
    }

    summary {
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--accent-amber);
      background-color: #16161a;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }

    summary::-webkit-details-marker { display: none; }

    .summary-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-count {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    .arrow-icon {
      font-size: 0.8rem;
      transition: transform 0.2s ease;
      color: var(--text-sub);
    }

    details[open] summary .arrow-icon {
      transform: rotate(180deg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-top: 1px solid var(--border-color);
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    th {
      background-color: #1a1a22;
      color: var(--text-sub);
      font-size: 0.8rem;
    }

    tr:hover { background-color: #252530; }

    .col-rank {
      width: 80px;
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--accent-amber);
    }

    .col-bemani { width: 70px; }
    .col-title { width: auto; }
    .col-title strong { font-size: 0.95rem; word-break: break-all; }
    .col-lamp { width: 140px; text-align: center; }

    .badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-12 { background-color: #4a1d24; color: #f87171; }
    .badge-11 { background-color: #1e3a5f; color: #60a5fa; }

    .col-lamp-container {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .lamp-label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .lamp-group {
      display: inline-flex;
      gap: 2px;
      background-color: #16161a;
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .lamp-btn {
      border: none;
      background-color: #2a2a35;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 32px;
      text-align: center;
      user-select: none;
    }

    .lamp-btn[data-lamp="E"].active { background-color: var(--lamp-easy); color: #fff; }
    .lamp-btn[data-lamp="H"].active { background-color: var(--lamp-hard); color: #fff; }
    .lamp-btn[data-lamp="EX"].active { background-color: var(--lamp-exhard); color: #000; }

    /* モバイル最適化（iPhone用 2行分割表示） */
    @media (max-width: 640px) {
      body {
        padding: 8px;
      }

      thead {
        display: none;
      }

      tr {
        display: flex;
        flex-wrap: wrap;
        padding: 10px 8px;
        align-items: center;
        gap: 6px;
        border-bottom: 1px solid var(--border-color);
      }

      td {
        padding: 0;
        border: none;
      }

      /* 1行目領域：片手難易度 + 公式難易度 + 曲名 */
      .col-rank {
        order: 1;
        width: auto;
        font-size: 0.85rem;
      }

      .col-bemani {
        order: 2;
        width: auto;
      }

      .col-title {
        order: 3;
        width: 100%;
        flex-basis: calc(100% - 110px);
        min-width: 0;
      }

      .col-title strong {
        font-size: 0.9rem;
      }

      /* 2行目領域：左片手 + 右片手 */
      .col-lamp-L {
        order: 4;
        display: inline-flex;
        width: auto;
        margin-top: 4px;
      }

      .col-lamp-R {
        order: 5;
        display: inline-flex;
        width: auto;
        margin-top: 4px;
        margin-left: 8px;
      }

      .col-lamp-container {
        gap: 4px;
      }

      .lamp-label {
        font-size: 0.75rem;
      }

      .lamp-group {
        padding: 2px;
        gap: 2px;
      }

      .lamp-btn {
        padding: 4px 6px;
        font-size: 0.75rem;
        min-width: 26px;
      }
    }
  </style>

  <!-- Firebase モジュール読み込み & 設定 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLvLVqpBAh9jbHsTbZc8mYy3OEjGpfXfI",
      authDomain: "dxonehandlamptool.firebaseapp.com",
      projectId: "dxonehandlamptool",
      storageBucket: "dxonehandlamptool.firebasestorage.app",
      messagingSenderId: "518633479589",
      appId: "1:518633479589:web:070ddaf3929639eb0f5c4c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let unsubscribeFirestore = null;

    const loginArea = document.getElementById('loginArea');
    const userArea = document.getElementById('userArea');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userIcon = document.getElementById('userIcon');
    const userName = document.getElementById('userName');
    const syncStatus = document.getElementById('syncStatus');

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("ログインエラー:", err);
        alert("Googleログインに失敗しました。");
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        if (unsubscribeFirestore) unsubscribeFirestore();
        await signOut(auth);
      } catch (err) {
        console.error("ログアウトエラー:", err);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName || 'ユーザー';
        userIcon.src = user.photoURL || '';
        
        loginArea.style.display = 'none';
        userArea.style.display = 'flex';

        listenToCloudData(user.uid);
      } else {
        currentUser = null;
        if (unsubscribeFirestore) unsubscribeFirestore();
        loginArea.style.display = 'block';
        userArea.style.display = 'none';
        syncStatus.textContent = '(未ログイン)';

        loadUserDataFromLocal();
        renderTable();
      }
    });

    function listenToCloudData(uid) {
      syncStatus.textContent = '同期中...';
      const docRef = doc(db, "cleardata", uid);

      unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          userClearData = docSnap.data().data || {};
          saveUserDataToLocal();
          syncStatus.textContent = '同期完了';
        } else {
          saveUserDataToCloud();
        }
        renderTable();
      }, (err) => {
        console.error("同期エラー:", err);
        syncStatus.textContent = '同期エラー';
      });
    }

    async function saveUserDataToCloud() {
      if (!currentUser) return;
      syncStatus.textContent = '保存中...';
      try {
        const docRef = doc(db, "cleardata", currentUser.uid);
        await setDoc(docRef, {
          data: userClearData,
          updatedAt: new Date().toISOString()
        }, { merge: true });
        syncStatus.textContent = '同期完了';
      } catch (err) {
        console.error("保存エラー:", err);
        syncStatus.textContent = '保存失敗';
      }
    }

    window.toggleLamp = function(title, hand, lampType) {
      if (!userClearData[title]) {
        userClearData[title] = { L: { E: false, H: false, EX: false }, R: { E: false, H: false, EX: false } };
      }
      
      const currentState = userClearData[title][hand][lampType];
      userClearData[title][hand][lampType] = !currentState;

      const newActiveState = !currentState;
      const baseBtnId = `lamp-${hand}-${lampType}-${slugify(title)}`;

      document.querySelectorAll(`[id="${baseBtnId}"]`).forEach(btnEl => {
        btnEl.classList.toggle('active', newActiveState);
      });

      saveUserDataToLocal();
      if (currentUser) {
        saveUserDataToCloud();
      }
    };
  </script>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>片手難易度表 Sparkle Shower</h1>

      <div class="auth-container">
        <div id="loginArea">
          <button id="loginBtn" class="btn btn-google">Googleログイン</button>
        </div>
        <div id="userArea" class="user-profile" style="display: none;">
          <img id="userIcon" class="user-avatar" src="" alt="Avatar">
          <span id="userName" class="user-name"></span>
          <button id="logoutBtn" class="btn">ログアウト</button>
        </div>
        <span id="syncStatus" class="sync-status"></span>
      </div>
    </div>

    <div id="meta" class="meta-info">データを読み込み中...</div>

    <div class="filter-panel">
      <div class="filter-group">
        <div class="filter-label">MODE</div>
        <div class="btn-group">
          <button class="btn btn-mode active" data-mode="AC">AC</button>
          <button class="btn btn-mode" data-mode="INF">INF</button>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>公式難易度 (複数選択可)</span>
          <button id="clearBemani" class="clear-btn">全解除</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-bemani" data-bemani="☆11">☆11</button>
          <button class="btn btn-bemani" data-bemani="☆12">☆12</button>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>片手難易度 (複数選択可)</span>
          <button id="clearRank" class="clear-btn">全解除</button>
        </div>
        <div class="btn-group" id="rankBtnContainer"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>ランプ状態フィルター</span>
          <button id="clearLampFilter" class="clear-btn">解除</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-lamp-filter" data-lampfilter="EXISTS">ランプあり</button>
          <button class="btn btn-lamp-filter" data-lampfilter="NONE">ランプなし</button>
          <button class="btn btn-lamp-filter" data-lampfilter="E">Eのみ</button>
          <button class="btn btn-lamp-filter" data-lampfilter="H">Hのみ</button>
          <button class="btn btn-lamp-filter" data-lampfilter="EX">EXのみ</button>
        </div>
      </div>

      <div class="filter-group">
        <input type="text" id="searchInput" class="search-input" placeholder="曲名で検索...">
      </div>

      <div class="filter-group">
        <button id="omikujiBtn" class="btn btn-omikuji">🎲 フィルター中から10曲おみくじ</button>
      </div>
    </div>

    <div id="accordionContainer">
      <div style="text-align: center; color: var(--text-sub); padding: 20px;">データを読み込み中...</div>
    </div>
  </div>

  <!-- おみくじ結果表示用モーダル -->
  <div id="omikujiModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🎲 本日のおみくじ (10曲)</h2>
        <button class="modal-close" id="closeModalBtn">✕</button>
      </div>
      <div class="modal-body" id="omikujiModalBody"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'sparkle_user_clear_data';
    const RANKS = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
    
    let songData = [];
    let userClearData = {};
    let currentFilteredSongs = [];

    let state = {
      mode: 'AC',
      selectedBemanis: [],
      selectedRanks: [],
      selectedLampFilter: null,
      searchQuery: ''
    };

    document.addEventListener('DOMContentLoaded', () => {
      buildRankButtons();
      setupEventListeners();
      loadUserDataFromLocal();
      fetchData();
    });

    function buildRankButtons() {
      const container = document.getElementById('rankBtnContainer');
      container.innerHTML = RANKS.map(rank => 
        `<button class="btn btn-rank" data-rank="${rank}">${rank}</button>`
      ).join('');
    }

    async function fetchData() {
      try {
        const res = await fetch('difficulty-data_normalized.json');
        if (!res.ok) throw new Error('JSONの読み込みに失敗しました');
        const data = await res.json();
        songData = data.songs;
        renderMeta(data.meta);
        renderTable();
      } catch (err) {
        document.getElementById('meta').innerText = 'データ読み込みエラー';
        document.getElementById('accordionContainer').innerHTML = 
          `<div style="color:#f87171; text-align:center; padding:20px;">エラー: ${err.message}</div>`;
      }
    }

    function renderMeta(meta) {
      document.getElementById('meta').innerText = 
        `全 ${meta.record_count} 件 (AC: ${meta.ac_count}件 / INF: ${meta.inf_count}件) | 更新日: ${meta.generated}`;
    }

    function setupEventListeners() {
      document.querySelectorAll('.btn-mode').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.mode = e.target.dataset.mode;
          renderTable();
        });
      });

      document.querySelectorAll('.btn-bemani').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const val = e.target.dataset.bemani;
          toggleSelection(val, state.selectedBemanis);
          e.target.classList.toggle('active');
          renderTable();
        });
      });

      document.getElementById('rankBtnContainer').addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-rank')) {
          const val = e.target.dataset.rank;
          toggleSelection(val, state.selectedRanks);
          e.target.classList.toggle('active');
          renderTable();
        }
      });

      document.querySelectorAll('.btn-lamp-filter').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const val = e.target.dataset.lampfilter;
          if (state.selectedLampFilter === val) {
            state.selectedLampFilter = null;
            e.target.classList.remove('active');
          } else {
            document.querySelectorAll('.btn-lamp-filter').forEach(b => b.classList.remove('active'));
            state.selectedLampFilter = val;
            e.target.classList.add('active');
          }
          renderTable();
        });
      });

      document.getElementById('clearLampFilter').addEventListener('click', () => {
        state.selectedLampFilter = null;
        document.querySelectorAll('.btn-lamp-filter').forEach(b => b.classList.remove('active'));
        renderTable();
      });

      document.getElementById('clearBemani').addEventListener('click', () => {
        state.selectedBemanis = [];
        document.querySelectorAll('.btn-bemani').forEach(b => b.classList.remove('active'));
        renderTable();
      });

      document.getElementById('clearRank').addEventListener('click', () => {
        state.selectedRanks = [];
        document.querySelectorAll('.btn-rank').forEach(b => b.classList.remove('active'));
        renderTable();
      });

      document.getElementById('searchInput').addEventListener('input', (e) => {
        state.searchQuery = e.target.value.toLowerCase().trim();
        renderTable();
      });

      document.getElementById('omikujiBtn').addEventListener('click', openOmikujiModal);
      document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.getElementById('omikujiModal').style.display = 'none';
      });
    }

    function toggleSelection(item, array) {
      const idx = array.indexOf(item);
      if (idx > -1) array.splice(idx, 1);
      else array.push(item);
    }

    function loadUserDataFromLocal() {
      try {
        const localData = localStorage.getItem(STORAGE_KEY);
        if (localData) {
          userClearData = JSON.parse(localData);
        }
      } catch (e) {
        console.error('LocalStorageの読み込みに失敗しました:', e);
      }
    }

    function saveUserDataToLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userClearData));
      } catch (e) {
        console.error('LocalStorageへの保存に失敗しました:', e);
      }
    }

    function checkLampStatus(title, filterType) {
      const info = userClearData[title];
      
      const hasL_E = info && info.L && info.L.E;
      const hasL_H = info && info.L && info.L.H;
      const hasL_EX = info && info.L && info.L.EX;

      const hasR_E = info && info.R && info.R.E;
      const hasR_H = info && info.R && info.R.H;
      const hasR_EX = info && info.R && info.R.EX;

      const anyLampActive = hasL_E || hasL_H || hasL_EX || hasR_E || hasR_H || hasR_EX;

      switch(filterType) {
        case 'EXISTS':
          return anyLampActive;
        case 'NONE':
          return !anyLampActive;
        case 'E':
          return hasL_E || hasR_E;
        case 'H':
          return hasL_H || hasR_H;
        case 'EX':
          return hasL_EX || hasR_EX;
        default:
          return true;
      }
    }

    function renderTable() {
      const container = document.getElementById('accordionContainer');

      currentFilteredSongs = songData.filter(song => {
        const isAcMode = state.mode === 'AC';
        const isPresent = isAcMode ? song.ac : song.inf;
        const targetRank = isAcMode ? song.acDifficulty : song.infDifficulty;

        if (!isPresent || !targetRank) return false;

        if (state.selectedBemanis.length > 0 && !state.selectedBemanis.includes(song.bemaniDifficulty)) {
          return false;
        }

        if (state.selectedRanks.length > 0 && !state.selectedRanks.includes(targetRank)) {
          return false;
        }

        if (state.selectedLampFilter && !checkLampStatus(song.title, state.selectedLampFilter)) {
          return false;
        }

        if (state.searchQuery && !song.title.toLowerCase().includes(state.searchQuery)) {
          return false;
        }

        return true;
      });

      if (currentFilteredSongs.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:40px; background:var(--card-bg); border-radius:8px;">該当する楽曲がありません</div>';
        return;
      }

      const grouped = {};
      RANKS.forEach(rank => { grouped[rank] = []; });

      currentFilteredSongs.forEach(song => {
        const rankVal = state.mode === 'AC' ? song.acDifficulty : song.infDifficulty;
        if (grouped[rankVal]) {
          grouped[rankVal].push(song);
        }
      });

      RANKS.forEach(rank => {
        grouped[rank].sort((a, b) => {
          if (a.bemaniDifficulty !== b.bemaniDifficulty) {
            return a.bemaniDifficulty.localeCompare(b.bemaniDifficulty);
          }
          return a.title.localeCompare(b.title, 'ja');
        });
      });

      let html = '';
      RANKS.forEach(rank => {
        const songsInRank = grouped[rank];
        if (songsInRank.length === 0) return;

        const rows = songsInRank.map(song => buildSongRowHtml(song)).join('');

        html += `
          <details class="accordion-group" open>
            <summary>
              <div class="summary-title">
                <span>難易度 ${rank}</span>
                <span class="summary-count">(${songsInRank.length}件)</span>
              </div>
              <span class="arrow-icon">▼</span>
            </summary>
            <table>
              <thead>
                <tr>
                  <th>片手難易度</th>
                  <th>公式難易度</th>
                  <th>曲名</th>
                  <th style="text-align:center;">左片手</th>
                  <th style="text-align:center;">右片手</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </details>
        `;
      });

      container.innerHTML = html;
    }

    function buildSongRowHtml(song) {
      const rank = state.mode === 'AC' ? song.acDifficulty : song.infDifficulty;
      const diffBadge = song.bemaniDifficulty === '☆12' ? 'badge-12' : 'badge-11';
      const titleKey = song.title;
      const clearInfo = userClearData[titleKey] || { L: { E: false, H: false, EX: false }, R: { E: false, H: false, EX: false } };

      return `
        <tr>
          <td class="col-rank">${escapeHtml(rank)}</td>
          <td class="col-bemani"><span class="badge ${diffBadge}">${song.bemaniDifficulty}</span></td>
          <td class="col-title"><strong>${escapeHtml(song.title)}</strong></td>
          <td class="col-lamp col-lamp-L">
            <div class="col-lamp-container">
              <span class="lamp-label">左</span>
              <div class="lamp-group">
                <button id="lamp-L-E-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L && clearInfo.L.E ? 'active' : ''}" data-lamp="E" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'E')">E</button>
                <button id="lamp-L-H-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L && clearInfo.L.H ? 'active' : ''}" data-lamp="H" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'H')">H</button>
                <button id="lamp-L-EX-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L && clearInfo.L.EX ? 'active' : ''}" data-lamp="EX" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'EX')">EX</button>
              </div>
            </div>
          </td>
          <td class="col-lamp col-lamp-R">
            <div class="col-lamp-container">
              <span class="lamp-label">右</span>
              <div class="lamp-group">
                <button id="lamp-R-E-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R && clearInfo.R.E ? 'active' : ''}" data-lamp="E" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'E')">E</button>
                <button id="lamp-R-H-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R && clearInfo.R.H ? 'active' : ''}" data-lamp="H" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'H')">H</button>
                <button id="lamp-R-EX-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R && clearInfo.R.EX ? 'active' : ''}" data-lamp="EX" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'EX')">EX</button>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function openOmikujiModal() {
      if (currentFilteredSongs.length === 0) {
        alert("おみくじを引く対象の楽曲がありません。フィルター条件を変更してください。");
        return;
      }

      const shuffled = [...currentFilteredSongs].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 10);

      const modalBody = document.getElementById('omikujiModalBody');
      const rows = selected.map(song => buildSongRowHtml(song)).join('');

      modalBody.innerHTML = `
        <div style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px;">
          (対象曲数: ${currentFilteredSongs.length}件 から選出)
        </div>
        <table>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;

      document.getElementById('omikujiModal').style.display = 'flex';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function slugify(str) {
      return encodeURIComponent(str).replace(/%/g, '_');
    }
  </script>
</body>
</html>
