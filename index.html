<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>片手難易度表 Sparkle Shower</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e2e38;

      /* クリアランプカラー */
      --lamp-easy: #43B54B;   /* 緑 */
      --lamp-hard: #E53935;   /* 赤 */
      --lamp-exhard-red: #E53935; /* 点滅用 赤 */
      --lamp-exhard-yellow: #f59e0b; /* 黄色 */
    }

    /* EX HARD 点滅アニメーション (赤と黄の交互点滅) */
    @keyframes exhard-blink {
      0%, 49% {
        background-color: var(--lamp-exhard-yellow);
        color: #000;
      }
      50%, 100% {
        background-color: var(--lamp-exhard-red);
        color: #fff;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .meta-info {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    /* フィルターエリア */
    .filter-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-label {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
      text-decoration: underline;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ボタン共通 */
    .btn {
      background-color: #2a2a35;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:hover {
      background-color: #363645;
    }

    /* MODE アクティブ */
    .btn-mode.active {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    /* 公式難易度 アクティブ */
    .btn-bemani.active {
      background-color: var(--accent-purple);
      border-color: var(--accent-purple);
      color: #fff;
    }

    /* 片手難易度 1~10 アクティブ */
    .btn-rank {
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-rank.active {
      background-color: var(--accent-amber);
      border-color: var(--accent-amber);
      color: #000;
    }

    /* 検索バー */
    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #16161a;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    /* アコーディオン */
    .accordion-group {
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--card-bg);
    }

    summary {
      padding: 12px 16px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-amber);
      background-color: #16161a;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }

    summary:hover {
      background-color: #22222a;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .summary-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .summary-count {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    .arrow-icon {
      font-size: 0.8rem;
      transition: transform 0.2s ease;
      color: var(--text-sub);
    }

    details[open] summary .arrow-icon {
      transform: rotate(180deg);
    }

    /* テーブルスタイル */
    table {
      width: 100%;
      border-collapse: collapse;
      border-top: 1px solid var(--border-color);
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    th {
      background-color: #1a1a22;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    tr:hover {
      background-color: #252530;
    }

    .col-rank {
      width: 90px;
      font-weight: bold;
      font-size: 1rem;
      color: var(--accent-amber);
    }

    .col-bemani {
      width: 80px;
    }

    .col-lamp {
      width: 180px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .badge-12 { background-color: #4a1d24; color: #f87171; }
    .badge-11 { background-color: #1e3a5f; color: #60a5fa; }

    /* クリアランプボタン群 */
    .lamp-group {
      display: inline-flex;
      gap: 4px;
      background-color: #16161a;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .lamp-btn {
      border: none;
      background-color: #2a2a35;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 38px;
      text-align: center;
      user-select: none;
    }

    .lamp-btn:hover {
      background-color: #3b3b4a;
      color: #fff;
    }

    /* ランプのアクティブ（ON）状態 */
    .lamp-btn[data-lamp="E"].active {
      background-color: var(--lamp-easy);
      color: #fff;
    }
    .lamp-btn[data-lamp="H"].active {
      background-color: var(--lamp-hard);
      color: #fff;
    }
    .lamp-btn[data-lamp="EX"].active {
      animation: exhard-blink 0.6s infinite steps(1);
    }

    /* レスポンシブ用調整 */
    @media (max-width: 768px) {
      .col-lamp {
        width: auto;
      }
      .lamp-btn {
        padding: 5px 8px;
        font-size: 0.85rem;
        min-width: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>片手難易度表 Sparkle Shower</h1>
    <div id="meta" class="meta-info">データを読み込み中...</div>

    <!-- フィルターパネル -->
    <div class="filter-panel">
      <!-- 1. MODE (AC / INF) -->
      <div class="filter-group">
        <div class="filter-label">MODE</div>
        <div class="btn-group">
          <button class="btn btn-mode active" data-mode="AC">AC</button>
          <button class="btn btn-mode" data-mode="INF">INF</button>
        </div>
      </div>

      <!-- 2. 公式難易度 (複数選択) -->
      <div class="filter-group">
        <div class="filter-label">
          <span>公式難易度 (複数選択可)</span>
          <button id="clearBemani" class="clear-btn">全解除</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-bemani" data-bemani="☆11">☆11</button>
          <button class="btn btn-bemani" data-bemani="☆12">☆12</button>
        </div>
      </div>

      <!-- 3. 片手難易度 1〜10 (複数選択) -->
      <div class="filter-group">
        <div class="filter-label">
          <span>片手難易度 (複数選択可)</span>
          <button id="clearRank" class="clear-btn">全解除</button>
        </div>
        <div class="btn-group" id="rankBtnContainer"></div>
      </div>

      <!-- 4. 検索バー -->
      <div class="filter-group">
        <input type="text" id="searchInput" class="search-input" placeholder="曲名で検索...">
      </div>
    </div>

    <!-- テーブルエリア -->
    <div id="accordionContainer">
      <div style="text-align: center; color: var(--text-sub); padding: 20px;">データを読み込み中...</div>
    </div>
  </div>

  <script>
    const RANKS = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
    
    let songData = [];
    let userClearData = {};

    let state = {
      mode: 'AC',
      selectedBemanis: [],
      selectedRanks: [],
      searchQuery: ''
    };

    document.addEventListener('DOMContentLoaded', () => {
      buildRankButtons();
      setupEventListeners();
      fetchData();
    });

    function buildRankButtons() {
      const container = document.getElementById('rankBtnContainer');
      container.innerHTML = RANKS.map(rank => 
        `<button class="btn btn-rank" data-rank="${rank}">${rank}</button>`
      ).join('');
    }

    async function fetchData() {
      try {
        const res = await fetch('difficulty-data_normalized.json');
        if (!res.ok) throw new Error('JSONの読み込みに失敗しました');
        const data = await res.json();
        songData = data.songs;
        renderMeta(data.meta);

        await loadUserData();
        
        renderTable();
      } catch (err) {
        document.getElementById('meta').innerText = 'データ読み込みエラー';
        document.getElementById('accordionContainer').innerHTML = 
          `<div style="color:#f87171; text-align:center; padding:20px;">エラー: ${err.message}</div>`;
      }
    }

    function renderMeta(meta) {
      document.getElementById('meta').innerText = 
        `全 ${meta.record_count} 件 (AC: ${meta.ac_count}件 / INF: ${meta.inf_count}件) | 更新日: ${meta.generated}`;
    }

    function setupEventListeners() {
      document.querySelectorAll('.btn-mode').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.mode = e.target.dataset.mode;
          renderTable();
        });
      });

      document.querySelectorAll('.btn-bemani').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const val = e.target.dataset.bemani;
          toggleSelection(val, state.selectedBemanis);
          e.target.classList.toggle('active');
          renderTable();
        });
      });

      document.getElementById('rankBtnContainer').addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-rank')) {
          const val = e.target.dataset.rank;
          toggleSelection(val, state.selectedRanks);
          e.target.classList.toggle('active');
          renderTable();
        }
      });

      document.getElementById('clearBemani').addEventListener('click', () => {
        state.selectedBemanis = [];
        document.querySelectorAll('.btn-bemani').forEach(b => b.classList.remove('active'));
        renderTable();
      });

      document.getElementById('clearRank').addEventListener('click', () => {
        state.selectedRanks = [];
        document.querySelectorAll('.btn-rank').forEach(b => b.classList.remove('active'));
        renderTable();
      });

      document.getElementById('searchInput').addEventListener('input', (e) => {
        state.searchQuery = e.target.value.toLowerCase().trim();
        renderTable();
      });
    }

    function toggleSelection(item, array) {
      const idx = array.indexOf(item);
      if (idx > -1) array.splice(idx, 1);
      else array.push(item);
    }

    window.toggleLamp = async function(title, hand, lampType) {
      if (!userClearData[title]) {
        userClearData[title] = { L: { E: false, H: false, EX: false }, R: { E: false, H: false, EX: false } };
      }
      
      const currentState = userClearData[title][hand][lampType];
      userClearData[title][hand][lampType] = !currentState;

      // 即座にUIへ反映
      const btnId = `lamp-${hand}-${lampType}-${slugify(title)}`;
      const btnEl = document.getElementById(btnId);
      if (btnEl) {
        btnEl.classList.toggle('active', !currentState);
      }

      // クリックした瞬間に即時保存を実行
      await saveUserData();
    };

    async function loadUserData() {
      // 1. まずローカルストレージから即時復元
      const localData = localStorage.getItem('sparkle_user_clear_data');
      if (localData) {
        try {
          userClearData = JSON.parse(localData);
        } catch (e) {
          console.error('LocalStorageの読み込みエラー', e);
        }
      }

      // 2. バックエンドAPIが利用可能な場合は同期を試行
      try {
        const response = await fetch('/api/userdata');
        if (response.ok) {
          const serverData = await response.json();
          if (serverData && Object.keys(serverData).length > 0) {
            userClearData = serverData;
            localStorage.setItem('sparkle_user_clear_data', JSON.stringify(userClearData));
          }
        }
      } catch (e) {
        console.warn('APIサーバー非接続（ローカルストレージデータを使用）');
      }
    }

    async function saveUserData() {
      const jsonString = JSON.stringify(userClearData);
      
      // 1. ローカルストレージへ即時保存 (確実にローカル保存)
      try {
        localStorage.setItem('sparkle_user_clear_data', jsonString);
      } catch (e) {
        console.error('LocalStorageへの保存失敗:', e);
      }

      // 2. サーバーAPIへ即時送信 (API環境が存在する場合)
      try {
        await fetch('/api/userdata', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: jsonString
        });
      } catch (e) {
        // 静的ホスティング等の環境での非同期エラーを許容
      }
    }

    function renderTable() {
      const container = document.getElementById('accordionContainer');

      const filtered = songData.filter(song => {
        const isAcMode = state.mode === 'AC';
        const isPresent = isAcMode ? song.ac : song.inf;
        const targetRank = isAcMode ? song.acDifficulty : song.infDifficulty;

        if (!isPresent || !targetRank) return false;

        if (state.selectedBemanis.length > 0 && !state.selectedBemanis.includes(song.bemaniDifficulty)) {
          return false;
        }

        if (state.selectedRanks.length > 0 && !state.selectedRanks.includes(targetRank)) {
          return false;
        }

        if (state.searchQuery && !song.title.toLowerCase().includes(state.searchQuery)) {
          return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:40px; background:var(--card-bg); border-radius:8px;">該当する楽曲がありません</div>';
        return;
      }

      const grouped = {};
      RANKS.forEach(rank => { grouped[rank] = []; });

      filtered.forEach(song => {
        const rankVal = state.mode === 'AC' ? song.acDifficulty : song.infDifficulty;
        if (grouped[rankVal]) {
          grouped[rankVal].push(song);
        }
      });

      RANKS.forEach(rank => {
        grouped[rank].sort((a, b) => {
          if (a.bemaniDifficulty !== b.bemaniDifficulty) {
            return a.bemaniDifficulty.localeCompare(b.bemaniDifficulty);
          }
          return a.title.localeCompare(b.title, 'ja');
        });
      });

      let html = '';
      RANKS.forEach(rank => {
        const songsInRank = grouped[rank];
        if (songsInRank.length === 0) return;

        const rows = songsInRank.map(song => {
          const diffBadge = song.bemaniDifficulty === '☆12' ? 'badge-12' : 'badge-11';
          const titleKey = song.title;
          const clearInfo = userClearData[titleKey] || { L: { E: false, H: false, EX: false }, R: { E: false, H: false, EX: false } };

          return `
            <tr>
              <td class="col-rank">${escapeHtml(rank)}</td>
              <td class="col-bemani"><span class="badge ${diffBadge}">${song.bemaniDifficulty}</span></td>
              <td><strong style="font-size: 1rem;">${escapeHtml(song.title)}</strong></td>
              <!-- 左片手 ランプ -->
              <td class="col-lamp">
                <div class="lamp-group">
                  <button id="lamp-L-E-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L.E ? 'active' : ''}" data-lamp="E" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'E')">E</button>
                  <button id="lamp-L-H-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L.H ? 'active' : ''}" data-lamp="H" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'H')">H</button>
                  <button id="lamp-L-EX-${slugify(titleKey)}" class="lamp-btn ${clearInfo.L.EX ? 'active' : ''}" data-lamp="EX" onclick="toggleLamp('${escapeJs(titleKey)}', 'L', 'EX')">EX</button>
                </div>
              </td>
              <!-- 右片手 ランプ -->
              <td class="col-lamp">
                <div class="lamp-group">
                  <button id="lamp-R-E-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R.E ? 'active' : ''}" data-lamp="E" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'E')">E</button>
                  <button id="lamp-R-H-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R.H ? 'active' : ''}" data-lamp="H" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'H')">H</button>
                  <button id="lamp-R-EX-${slugify(titleKey)}" class="lamp-btn ${clearInfo.R.EX ? 'active' : ''}" data-lamp="EX" onclick="toggleLamp('${escapeJs(titleKey)}', 'R', 'EX')">EX</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        html += `
          <details class="accordion-group" open>
            <summary>
              <div class="summary-title">
                <span>難易度 ${rank}</span>
                <span class="summary-count">(${songsInRank.length}件)</span>
              </div>
              <span class="arrow-icon">▼</span>
            </summary>
            <table>
              <thead>
                <tr>
                  <th>片手難易度</th>
                  <th>公式難易度</th>
                  <th>曲名</th>
                  <th style="text-align:center;">左片手</th>
                  <th style="text-align:center;">右片手</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </details>
        `;
      });

      container.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function slugify(str) {
      return encodeURIComponent(str).replace(/%/g, '_');
    }
  </script>
</body>
</html>
